<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<meta name="theme-color" content="#070a16" />
<title>Arena X — Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
  min-height:100%;
  background:#070a16;
  color:#e8ecf5;
  font-family:'Poppins',system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}

/* ═══════════════════════════════════════════════════════════
   🎬 ANIME GAMER GIRL VIDEO BACKGROUND
   Futuristic gaming setup with RGB lights
═══════════════════════════════════════════════════════════ */
#bgVideo{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:-2;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.5s ease;
  background:#070a16;
}
#bgVideo.loaded{opacity:1;}
#bgVideo::-webkit-media-controls,
#bgVideo::-webkit-media-controls-enclosure,
#bgVideo::-webkit-media-controls-panel,
#bgVideo::-webkit-media-controls-start-playback-button{
  display:none !important;
  -webkit-appearance:none;
}

/* ═══════════════════════════════════════════════════════════
   🌑 DARK OVERLAY for readability
═══════════════════════════════════════════════════════════ */
#bgOverlay{
  position:fixed;
  inset:0;
  background:rgba(7,10,22,0.70);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:-1;
  pointer-events:none;
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════ */
.wrap{
  position:relative;
  z-index:5;
  max-width:680px;
  margin:0 auto;
  padding:36px 18px 140px;
}

/* ═══════════════════════════════════════════════════════════
   BRAND
═══════════════════════════════════════════════════════════ */
.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:12px;
  text-decoration:none;
}

.brand-logo{
  width:90px;
  height:90px;
  object-fit:contain;
  filter:drop-shadow(0 0 20px rgba(0,242,254,0.6))
         drop-shadow(0 0 40px rgba(157,0,255,0.4));
  animation:logoPulse 3s ease-in-out infinite;
  transition:transform 0.4s ease;
}
.brand-logo:hover{
  transform:scale(1.08) rotate(-3deg);
}
@keyframes logoPulse{
  0%,100%{
    filter:drop-shadow(0 0 20px rgba(0,242,254,0.6))
           drop-shadow(0 0 40px rgba(157,0,255,0.4));
  }
  50%{
    filter:drop-shadow(0 0 30px rgba(0,242,254,1))
           drop-shadow(0 0 60px rgba(157,0,255,0.8));
  }
}

.brand-mark{
  display:none;
  width:60px;
  height:60px;
  border-radius:14px;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg, #00f2fe, #9d00ff);
  box-shadow:0 0 30px rgba(0,242,254,0.7), 0 0 60px rgba(157,0,255,0.5);
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:32px;
  color:#070a16;
  animation:markPulse 3s ease-in-out infinite;
}
@keyframes markPulse{
  0%,100%{box-shadow:0 0 30px rgba(0,242,254,0.7), 0 0 60px rgba(157,0,255,0.5);}
  50%    {box-shadow:0 0 45px rgba(0,242,254,1), 0 0 90px rgba(157,0,255,0.8);}
}

.brand-name{
  font-family:'Orbitron',sans-serif;
  font-size:26px;
  font-weight:900;
  letter-spacing:6px;
  color:#ffffff;
  text-shadow:
    0 0 20px rgba(0,242,254,0.9),
    0 0 40px rgba(157,0,255,0.6);
}

/* ═══════════════════════════════════════════════════════════
   TITLE — Animated cyan gradient shine
═══════════════════════════════════════════════════════════ */
.page-title{
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:22px;
  font-weight:900;
  letter-spacing:3.5px;
  text-transform:uppercase;
  margin:6px 0 8px;
  background:linear-gradient(
    120deg,
    #ffffff 0%,
    #00f2fe 25%,
    #9d00ff 50%,
    #00f2fe 75%,
    #ffffff 100%
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:titleShine 5s linear infinite;
  filter:drop-shadow(0 0 12px rgba(0,242,254,0.5));
}
@keyframes titleShine{
  0%  {background-position:0% 50%;}
  100%{background-position:200% 50%;}
}

.page-sub{
  text-align:center;
  color:#b8c0d8;
  font-size:13.5px;
  margin-bottom:28px;
  max-width:440px;
  margin-left:auto;
  margin-right:auto;
  line-height:1.65;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}
.page-sub b{
  color:#00f2fe;
  font-weight:600;
  text-shadow:0 0 10px rgba(0,242,254,0.6);
}

/* ═══════════════════════════════════════════════════════════
   GLASSMORPHISM CARD
═══════════════════════════════════════════════════════════ */
.glass-card{
  position:relative;
  background:rgba(12,16,35,0.75);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(0,242,254,0.35);
  box-shadow:
    0 0 30px rgba(0,242,254,0.2),
    0 20px 60px rgba(0,0,0,0.7);
  border-radius:18px;
  padding:26px 22px 28px;
  animation:cardGlow 4s ease-in-out infinite;
}
@keyframes cardGlow{
  0%,100%{
    box-shadow:
      0 0 30px rgba(0,242,254,0.2),
      0 20px 60px rgba(0,0,0,0.7);
  }
  50%{
    box-shadow:
      0 0 50px rgba(0,242,254,0.4),
      0 20px 60px rgba(0,0,0,0.7);
  }
}
.glass-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg, #00f2fe, #9d00ff, #ff2e88, #00f2fe);
  background-size:200% auto;
  border-radius:18px 18px 0 0;
  box-shadow:0 0 22px rgba(0,242,254,0.8);
  animation:topBarShine 3s linear infinite;
}
@keyframes topBarShine{
  0%  {background-position:0% 50%;}
  100%{background-position:200% 50%;}
}

/* ═══════════════════════════════════════════════════════════
   FORM FIELDS
═══════════════════════════════════════════════════════════ */
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:11.5px;
  font-weight:600;
  color:#8b93b0;
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin-bottom:8px;
  text-shadow:0 1px 4px rgba(0,0,0,0.6);
}
.field label .req{color:#ff2e88; margin-left:3px;}

.field input[type="text"],
.field input[type="email"],
.field select,
.field textarea{
  width:100%;
  font-family:'Poppins',sans-serif;
  font-size:14.5px;
  color:#e8ecf5;
  background:rgba(5,8,20,0.8);
  border:1px solid rgba(0,242,254,0.35);
  border-radius:12px;
  padding:13px 15px;
  outline:none;
  transition:border-color 0.3s, box-shadow 0.3s;
  -webkit-appearance:none;
  appearance:none;
}
.field textarea{min-height:96px; resize:vertical; line-height:1.55;}
.field input::placeholder,
.field textarea::placeholder{color:#5b6382;}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#00f2fe;
  background:rgba(5,8,20,0.95);
  box-shadow:
    0 0 0 3px rgba(0,242,254,0.2),
    0 0 24px rgba(0,242,254,0.55),
    0 0 50px rgba(157,0,255,0.25);
}

.field select{
  background-image:
    linear-gradient(45deg, transparent 50%, #00f2fe 50%),
    linear-gradient(135deg, #00f2fe 50%, transparent 50%);
  background-position:
    calc(100% - 20px) calc(50% - 3px),
    calc(100% - 15px) calc(50% - 3px);
  background-size:5px 5px;
  background-repeat:no-repeat;
  padding-right:42px;
  cursor:pointer;
}
.field select option{background:#0d1024; color:#e8ecf5; padding:10px;}

/* ═══════════════════════════════════════════════════════════
   FILE BOX
═══════════════════════════════════════════════════════════ */
.file-box{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:22px 16px;
  text-align:center;
  background:rgba(5,8,20,0.7);
  border:2px dashed rgba(0,242,254,0.5);
  border-radius:12px;
  cursor:pointer;
  transition:border-color 0.3s, background 0.3s, box-shadow 0.3s;
}
.file-box:hover,
.file-box.dragover{
  border-color:#00f2fe;
  background:rgba(0,242,254,0.08);
  box-shadow:0 0 30px rgba(0,242,254,0.3);
}
.file-box.has-file{
  border-style:solid;
  border-color:#00e676;
  background:rgba(0,230,118,0.08);
  box-shadow:0 0 30px rgba(0,230,118,0.25);
}
.file-box input[type="file"]{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  opacity:0;
  cursor:pointer;
}
.file-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:linear-gradient(135deg, rgba(0,242,254,0.25), rgba(157,0,255,0.25));
  border:1px solid rgba(0,242,254,0.5);
  transition:transform 0.3s ease;
}
.file-box:hover .file-icon{transform:translateY(-3px) rotate(-4deg);}
.file-text{font-size:13.5px; color:#b8c0d8; line-height:1.45;}
.file-text b{color:#00f2fe; font-weight:600;}
.file-name{
  font-size:12.5px;
  color:#00e676;
  font-weight:600;
  max-width:100%;
  word-break:break-all;
  padding:4px 10px;
  border-radius:6px;
  background:rgba(0,230,118,0.12);
  border:1px solid rgba(0,230,118,0.4);
  display:none;
  margin-top:2px;
}
.file-name.show{display:inline-block;}
.file-size{font-size:11px; color:#5b6382; margin-top:2px;}

/* ═══════════════════════════════════════════════════════════
   SUBMIT BUTTON
═══════════════════════════════════════════════════════════ */
.submit-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:16px 20px;
  margin-top:22px;
  border:none;
  border-radius:12px;
  font-family:'Orbitron',sans-serif;
  font-size:14px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#070a16;
  cursor:pointer;
  overflow:hidden;
  background:linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #9d00ff 100%);
  background-size:200% auto;
  box-shadow:
    0 10px 30px rgba(0,242,254,0.5),
    0 0 0 1px rgba(0,242,254,0.6) inset;
  transition:transform 0.3s, box-shadow 0.3s, background-position 0.3s;
  animation:btnGlow 2.6s ease-in-out infinite;
}
@keyframes btnGlow{
  0%,100%{
    box-shadow:
      0 10px 30px rgba(0,242,254,0.5),
      0 0 0 1px rgba(0,242,254,0.6) inset,
      0 0 0 0 rgba(0,242,254,0.5);
  }
  50%{
    box-shadow:
      0 14px 45px rgba(0,242,254,0.85),
      0 0 0 1px rgba(0,242,254,0.9) inset,
      0 0 0 14px rgba(0,242,254,0);
  }
}
.submit-btn::after{
  content:"";
  position:absolute;
  top:0; left:-60%;
  width:40%; height:100%;
  background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.7) 50%, transparent 100%);
  transform:skewX(-18deg);
  animation:btnShimmer 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes btnShimmer{
  0%   {left:-60%;}
  50%  {left:120%;}
  100% {left:120%;}
}
.submit-btn:hover:not(:disabled){
  transform:translateY(-3px);
  background-position:100% 50%;
  box-shadow:
    0 18px 50px rgba(0,242,254,0.9),
    0 0 0 1px rgba(0,242,254,1) inset,
    0 0 60px rgba(157,0,255,0.7);
}
.submit-btn:active:not(:disabled){transform:translateY(-1px) scale(0.99);}
.submit-btn:disabled{cursor:not-allowed; opacity:0.75; animation:none;}
.submit-btn:disabled::after{display:none;}
.submit-btn > *{position:relative; z-index:2;}
.btn-icon{font-size:16px;}

.spinner{
  display:inline-block;
  width:16px; height:16px;
  border:2px solid rgba(7,10,22,0.3);
  border-top-color:#070a16;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ═══════════════════════════════════════════════════════════
   STATUS
═══════════════════════════════════════════════════════════ */
.status{
  display:none;
  margin-top:16px;
  padding:13px 16px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:500;
  line-height:1.55;
  align-items:center;
  gap:10px;
  animation:statusIn 0.35s ease;
}
.status.show{display:flex;}
@keyframes statusIn{
  from{opacity:0; transform:translateY(-8px);}
  to{opacity:1; transform:translateY(0);}
}
.status .st-ico{font-size:18px; flex-shrink:0;}
.status.success{background:rgba(0,230,118,0.12); border:1px solid rgba(0,230,118,0.6); color:#9aebbc; box-shadow:0 0 30px rgba(0,230,118,0.3);}
.status.error{background:rgba(255,46,81,0.12); border:1px solid rgba(255,46,81,0.6); color:#ffb0bd; box-shadow:0 0 30px rgba(255,46,81,0.3);}
.status.loading{background:rgba(0,242,254,0.1); border:1px solid rgba(0,242,254,0.6); color:#a6eaff; box-shadow:0 0 30px rgba(0,242,254,0.3);}

/* ═══════════════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════════════ */
.foot-note{
  text-align:center;
  margin-top:26px;
  font-size:12px;
  color:#b8c0d8;
  line-height:1.7;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}
.foot-note b{
  color:#00f2fe;
  font-weight:600;
  text-shadow:0 0 10px rgba(0,242,254,0.6);
}

/* ═══════════════════════════════════════════════════════════
   🎵 MUSIC BUTTON — Phonk music toggle (bottom-right)
═══════════════════════════════════════════════════════════ */
#musicToggle{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:2147483647;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg, #00f2fe, #9d00ff);
  border:3px solid #ffffff;
  color:#ffffff;
  font-size:26px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 25px rgba(0,242,254,0.9),
    0 0 50px rgba(157,0,255,0.7),
    0 8px 30px rgba(0,0,0,0.7);
  transition:transform 0.2s, box-shadow 0.2s, background 0.3s;
  animation:musicPulse 2s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
@keyframes musicPulse{
  0%,100%{transform:scale(1);}
  50%    {transform:scale(1.08);}
}
#musicToggle:hover{
  transform:scale(1.15);
  box-shadow:
    0 0 35px rgba(0,242,254,1),
    0 0 70px rgba(157,0,255,0.9),
    0 12px 40px rgba(0,0,0,0.8);
}
#musicToggle:active{transform:scale(0.9) !important;}
#musicToggle.playing{
  background:linear-gradient(135deg, #00e676, #00f2fe);
}
#musicToggle.playing::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:2px solid rgba(0,230,118,0.6);
  animation:musicRing 1.6s ease-out infinite;
}
@keyframes musicRing{
  0%  {transform:scale(1);opacity:1;}
  100%{transform:scale(1.5);opacity:0;}
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════ */
@media(min-width:640px){
  .wrap{padding:52px 24px 140px;}
  .glass-card{padding:34px 30px;}
  .brand-logo{width:110px; height:110px;}
  .brand-name{font-size:28px; letter-spacing:7px;}
  .page-title{font-size:26px; letter-spacing:4.5px;}
  .submit-btn{padding:18px; font-size:15px;}
}
@media(max-width:380px){
  .page-title{font-size:18px; letter-spacing:2.5px;}
  .brand-logo{width:80px; height:80px;}
  .brand-name{font-size:22px; letter-spacing:5px;}
  #musicToggle{width:54px; height:54px; font-size:22px;}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.15s !important;
  }
  #bgVideo{display:none;}
  .submit-btn::after{display:none;}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     🎬 ANIME GAMER GIRL VIDEO BACKGROUND
     Yahan tumhari PDF wali video URL daal do (agar hai)
     Nahi toh ye Pixabay/Pexels wale chalenge
═══════════════════════════════════════════════════════════ -->
<video
  id="bgVideo"
  autoplay
  loop
  muted
  playsinline
  preload="auto"
  disablepictureinpicture
  controlslist="nodownload nofullscreen noremoteplayback"
>
  <!-- 🔥 Yahan apni PDF wali video ka URL daalo (agar hosted hai) -->
  <source src="gamer-video.mp4" type="video/mp4" />
  <!-- Fallback sources (Pixabay + Pexels CDN) -->
  <source src="https://cdn.pixabay.com/video/2024/03/07/203235-922766150_large.mp4" type="video/mp4" />
  <source src="https://cdn.pixabay.com/video/2023/06/14/167154-836651422_large.mp4" type="video/mp4" />
  <source src="https://videos.pexels.com/video-files/3141210/3141210-uhd_2560_1440_25fps.mp4" type="video/mp4" />
  <source src="https://videos.pexels.com/video-files/3129671/3129671-uhd_2560_1440_30fps.mp4" type="video/mp4" />
</video>

<!-- 🌑 Dark overlay -->
<div id="bgOverlay" aria-hidden="true"></div>

<!-- 🎵 Background phonk music -->
<audio id="bgMusic" loop preload="auto" playsinline>
  <!-- 🔥 Apni phonk.mp3 same folder mein rakho -->
  <source src="phonk.mp3" type="audio/mpeg" />
  <source src="music.mp3" type="audio/mpeg" />
  <!-- Online fallback -->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
</audio>

<!-- 🎵 Music toggle button -->
<button id="musicToggle" type="button" aria-label="Toggle music" title="Play Music">
  <span id="musicIcon">🔇</span>
</button>

<!-- ═══════════════════════════════════════════════════════════
     MAIN CONTENT
═══════════════════════════════════════════════════════════ -->
<main class="wrap">

  <a href="index.html" class="brand">
    <!-- Real ArenaX logo -->
    <img
      src="logo.png"
      alt="ArenaX Logo"
      class="brand-logo"
      onerror="this.style.display='none'; document.getElementById('fallbackMark').style.display='flex';"
    />
    <!-- Fallback logo -->
    <div class="brand-mark" id="fallbackMark">A</div>
    <div class="brand-name">ARENA X</div>
  </a>

  <h1 class="page-title">Arena X Support</h1>
  <p class="page-sub">
    Submit your <b>payment proof</b> or <b>match results</b> to Admin.<br>
    Our team responds within 24 hours.
  </p>

  <div class="glass-card">
    <form id="supportForm" autocomplete="off" novalidate>

      <div class="field">
        <label for="playerName">Player Name / In-Game ID <span class="req">*</span></label>
        <input type="text" id="playerName" name="playerName" placeholder="e.g. ShadowX_007  •  5123456789" required maxlength="60" />
      </div>

      <div class="field">
        <label for="userContact">WhatsApp No. / Registered Email <span class="req">*</span></label>
        <input type="text" id="userContact" name="userContact" placeholder="+91 98765 43210  or  you@example.com" required maxlength="80" />
      </div>

      <div class="field">
        <label for="issueType">Issue Category <span class="req">*</span></label>
        <select id="issueType" name="issueType" required>
          <option value="" disabled selected>-- Select a category --</option>
          <option value="Match Result Screenshot">🏆 Match Result Screenshot</option>
          <option value="Payment Deposit Issue">💳 Payment Deposit Issue</option>
          <option value="Withdrawal Inquiry">💸 Withdrawal Inquiry</option>
          <option value="App Bug">🐞 App Bug</option>
          <option value="Other Query">💬 Other Query</option>
        </select>
      </div>

      <div class="field">
        <label for="description">Problem Description / Match Details <span class="req">*</span></label>
        <textarea id="description" name="description" placeholder="Describe your issue with match ID, time, UPI ref, etc." required maxlength="800"></textarea>
      </div>

      <div class="field">
        <label>Screenshot / Proof (Optional but recommended)</label>
        <div class="file-box" id="fileBox">
          <input type="file" id="fileInput" name="fileInput" accept="image/*" />
          <div class="file-icon" id="fileIcon">📷</div>
          <div class="file-text" id="fileText">
            <b>Tap to upload</b> or drag &amp; drop<br>
            JPG, PNG • Max 5 MB
          </div>
          <div class="file-name" id="fileName"></div>
          <div class="file-size" id="fileSize"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-icon">🚀</span>
        <span id="submitLabel">Submit to Admin</span>
      </button>

      <div class="status" id="statusBox" role="status" aria-live="polite">
        <span class="st-ico" id="statusIco"></span>
        <span id="statusText"></span>
      </div>

    </form>
  </div>

  <p class="foot-note">
    🔒 Your data is only shared with Arena X admins.<br>
    Need instant help? Ping us on <b>support@arenax.gg</b>
  </p>

</main>

<script>
/* ═══════════════════════════════════════════════════════════
   ⚙️  CONFIG — Paste your Google Apps Script URL here
═══════════════════════════════════════════════════════════ */
const scriptURL = 'https://script.google.com/macros/s/AKfycbzmG-gsYeroMi1MrZkwCehNo0Vu34LjGCxDfdgo22GVs02OPVxN3s8GPFdiKMi5iX8/exec';

/* DOM REFERENCES */
const form         = document.getElementById('supportForm');
const fileBox      = document.getElementById('fileBox');
const fileInput    = document.getElementById('fileInput');
const fileNameEl   = document.getElementById('fileName');
const fileSizeEl   = document.getElementById('fileSize');
const fileTextEl   = document.getElementById('fileText');
const submitBtn    = document.getElementById('submitBtn');
const submitLabel  = document.getElementById('submitLabel');
const statusBox    = document.getElementById('statusBox');
const statusIco    = document.getElementById('statusIco');
const statusText   = document.getElementById('statusText');

let selectedFile = null;

/* ═══════════════════════════════════════════════════════════
   🎬 VIDEO BACKGROUND INITIALIZER
═══════════════════════════════════════════════════════════ */
(function initVideoBackground() {
  const vid = document.getElementById('bgVideo');
  if (!vid) return;

  console.log('🎬 Loading video background...');

  function markLoaded() {
    vid.classList.add('loaded');
    console.log('✅ Video background loaded');
  }

  vid.addEventListener('loadeddata', markLoaded);
  vid.addEventListener('playing', markLoaded);

  vid.addEventListener('error', () => {
    console.warn('⚠️ Video failed — dark background active');
    vid.style.display = 'none';
  }, true);

  const p = vid.play();
  if (p && typeof p.catch === 'function') {
    p.catch((err) => {
      console.warn('⚠️ Autoplay blocked:', err.message);
      const retry = () => {
        vid.play().catch(() => {});
        document.removeEventListener('click', retry);
        document.removeEventListener('touchstart', retry);
      };
      document.addEventListener('click', retry, { once: true });
      document.addEventListener('touchstart', retry, { once: true });
    });
  }

  setTimeout(() => {
    if (vid.readyState < 2) {
      console.warn('⏱ Video timeout');
      vid.style.display = 'none';
    }
  }, 10000);
})();

/* ═══════════════════════════════════════════════════════════
   🎵 MUSIC SYSTEM — Phonk music with 3-layer fallback
   1. Native MP3 (phonk.mp3)
   2. Online stream (SoundHelix)
   3. Web Audio API Synth (live phonk beat)
═══════════════════════════════════════════════════════════ */
(function initMusic() {
  const music = document.getElementById('bgMusic');
  const toggle = document.getElementById('musicToggle');
  const icon = document.getElementById('musicIcon');

  if (!toggle || !icon) {
    console.error('❌ Music button not found');
    return;
  }

  console.log('🎵 Music system initializing...');

  let isPlaying = false;
  let audioCtx = null;
  let synthStop = null;
  let usingSynth = false;

  function updateUI() {
    icon.textContent = isPlaying ? '🔊' : '🔇';
    toggle.classList.toggle('playing', isPlaying);
    toggle.setAttribute('title', isPlaying ? 'Pause Music' : 'Play Music');
  }

  /* 🎹 SYNTH FALLBACK — Live phonk beat */
  function startSynth() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          console.error('❌ Web Audio API not supported');
          return false;
        }
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const master = audioCtx.createGain();
      master.gain.value = 0.12;
      master.connect(audioCtx.destination);

      const bpm = 140;
      const stepDur = 60 / bpm / 4;
      let step = 0;
      let stopped = false;

      function kick(t) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(140, t);
        o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(0.9, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + 0.25);
      }

      function bass(freq, t, len) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const f = audioCtx.createBiquadFilter();
        o.type = 'sawtooth';
        o.frequency.value = freq;
        f.type = 'lowpass';
        f.frequency.value = 280;
        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + len);
        o.connect(f);
        f.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + len);
      }

      function hat(t) {
        const size = audioCtx.sampleRate * 0.05;
        const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
        const s = audioCtx.createBufferSource();
        s.buffer = buf;
        const g = audioCtx.createGain();
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 7000;
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        s.connect(hp);
        hp.connect(g);
        g.connect(master);
        s.start(t);
        s.stop(t + 0.05);
      }

      const notes = [55, 55, 82.4, 55, 65.4, 55, 73.4, 55];
      let nextTime = audioCtx.currentTime + 0.1;

      function loop() {
        if (stopped) return;
        while (nextTime < audioCtx.currentTime + 0.2) {
          const t = nextTime;
          if (step % 4 === 0) kick(t);
          if (step % 2 === 0 || Math.random() > 0.4) hat(t);
          if (step % 8 === 0) bass(notes[(step / 8) % notes.length], t, stepDur * 6);
          if (step % 16 === 12) bass(41.2, t, stepDur * 4);
          step++;
          nextTime += stepDur;
        }
        requestAnimationFrame(loop);
      }
      loop();

      synthStop = () => { stopped = true; };
      usingSynth = true;
      console.log('🎹 Synth phonk beat playing');
      return true;
    } catch (err) {
      console.warn('Synth failed:', err);
      return false;
    }
  }

  function stopSynth() {
    if (synthStop) {
      try { synthStop(); } catch (e) {}
      synthStop = null;
    }
    if (audioCtx) {
      try { audioCtx.suspend(); } catch (e) {}
    }
    usingSynth = false;
  }

  function tryNative() {
    return new Promise((resolve, reject) => {
      if (!music) return reject('no audio element');
      music.volume = 0.5;
      const p = music.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          console.log('🔊 Native audio playing');
          resolve();
        }).catch((err) => {
          console.warn('⚠️ Native audio failed:', err.message);
          reject(err);
        });
      } else {
        console.log('🔊 Native audio playing (legacy)');
        resolve();
      }
    });
  }

  function tryPlay() {
    tryNative().then(() => {
      isPlaying = true;
      updateUI();
    }).catch(() => {
      console.log('🔄 Trying synth fallback...');
      if (startSynth()) {
        isPlaying = true;
        updateUI();
      } else {
        console.error('❌ All music sources failed');
        isPlaying = false;
        updateUI();
        icon.textContent = '⚠️';
        setTimeout(() => { icon.textContent = '🔇'; }, 2000);
      }
    });
  }

  function stopPlay() {
    try { music.pause(); } catch (e) {}
    if (usingSynth) stopSynth();
    isPlaying = false;
    updateUI();
  }

  /* Click handler */
  toggle.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    console.log('🖱️ Music button clicked. Playing:', isPlaying);

    toggle.style.transform = 'scale(0.9)';
    setTimeout(() => { toggle.style.transform = ''; }, 150);

    if (isPlaying) stopPlay();
    else tryPlay();
  });

  /* Touch handler */
  toggle.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggle.click();
  }, { passive: false });

  console.log('✅ Music button ready');
})();

/* ═══════════════════════════════════════════════════════════
   FILE HANDLING
═══════════════════════════════════════════════════════════ */
function humanSize(bytes){
  if (!bytes && bytes !== 0) return '';
  const units = ['B','KB','MB','GB'];
  let i = 0;
  let n = bytes;
  while (n >= 1024 && i < units.length - 1){
    n /= 1024;
    i++;
  }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + units[i];
}

function handleFile(file){
  if (!file){
    selectedFile = null;
    fileBox.classList.remove('has-file');
    fileNameEl.classList.remove('show');
    fileNameEl.textContent = '';
    fileSizeEl.textContent = '';
    fileTextEl.style.display = '';
    return;
  }
  if (!file.type.startsWith('image/')){
    showStatus('error', '⚠️', 'Only image files (JPG, PNG) are allowed.');
    fileInput.value = '';
    return;
  }
  const MAX = 5 * 1024 * 1024;
  if (file.size > MAX){
    showStatus('error', '⚠️', 'File too large. Max 5 MB allowed.');
    fileInput.value = '';
    return;
  }
  selectedFile = file;
  fileBox.classList.add('has-file');
  fileTextEl.style.display = 'none';
  fileNameEl.textContent = '📎 ' + file.name;
  fileNameEl.classList.add('show');
  fileSizeEl.textContent = humanSize(file.size);
  clearStatus();
}

fileInput.addEventListener('change', (e) => {
  handleFile(e.target.files && e.target.files[0]);
});

['dragenter','dragover'].forEach(evt => {
  fileBox.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    fileBox.classList.add('dragover');
  });
});

['dragleave','drop'].forEach(evt => {
  fileBox.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    fileBox.classList.remove('dragover');
  });
});

fileBox.addEventListener('drop', (e) => {
  const dt = e.dataTransfer;
  if (dt && dt.files && dt.files[0]){
    fileInput.files = dt.files;
    handleFile(dt.files[0]);
  }
});

/* ═══════════════════════════════════════════════════════════
   STATUS HELPERS
═══════════════════════════════════════════════════════════ */
function showStatus(type, icon, text){
  statusBox.className = 'status show ' + type;
  statusIco.textContent = icon;
  statusText.textContent = text;
}

function clearStatus(){
  statusBox.className = 'status';
  statusIco.textContent = '';
  statusText.textContent = '';
}

/* ═══════════════════════════════════════════════════════════
   FILE → BASE64
═══════════════════════════════════════════════════════════ */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      const comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = () => reject(new Error('File read failed.'));
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════════════════════
   FORM SUBMIT
═══════════════════════════════════════════════════════════ */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearStatus();

  const playerName  = document.getElementById('playerName').value.trim();
  const userContact = document.getElementById('userContact').value.trim();
  const issueType   = document.getElementById('issueType').value;
  const description = document.getElementById('description').value.trim();

  if (!playerName || playerName.length < 2){
    showStatus('error', '⚠️', 'Please enter a valid Player Name / In-Game ID.');
    return;
  }
  if (!userContact || userContact.length < 5){
    showStatus('error', '⚠️', 'Please enter a valid WhatsApp number or email.');
    return;
  }
  if (!issueType){
    showStatus('error', '⚠️', 'Please select an issue category.');
    return;
  }
  if (!description || description.length < 5){
    showStatus('error', '⚠️', 'Please describe your issue briefly.');
    return;
  }
  if (!scriptURL || scriptURL === 'YOUR_GOOGLE_APPS_SCRIPT_URL'){
    showStatus('error', '⚙️', 'Admin endpoint not configured. Please contact support directly.');
    return;
  }

  submitBtn.disabled = true;
  const originalLabel = submitLabel.textContent;
  submitLabel.innerHTML = '<span class="spinner"></span> Sending...';
  showStatus('loading', '🔄', 'Uploading your request, please wait...');

  try {
    let fileData = '';
    let fileName = '';
    let mimeType = '';

    if (selectedFile){
      showStatus('loading', '🔄', 'Converting screenshot...');
      fileData = await fileToBase64(selectedFile);
      fileName = selectedFile.name;
      mimeType = selectedFile.type;
    }

    const payload = {
      playerName: playerName,
      userContact: userContact,
      issueType: issueType,
      description: description,
      fileName: fileName,
      mimeType: mimeType,
      fileData: fileData,
      userAgent: navigator.userAgent,
      submittedAt: new Date().toISOString()
    };

    showStatus('loading', '🔄', 'Sending to admin...');

    const resp = await fetch(scriptURL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    if (!resp.ok){
      throw new Error('Server responded with ' + resp.status);
    }

    showStatus('success', '✅', 'Request sent successfully! Admin will contact you within 24 hours.');
    form.reset();
    handleFile(null);

  } catch (err){
    console.error('Submit error:', err);
    showStatus('error', '❌', 'Failed to send: ' + (err.message || 'unknown error') + '. Please try again.');
  } finally {
    submitBtn.disabled = false;
    submitLabel.textContent = originalLabel;
  }
});

form.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file'){
    e.preventDefault();
  }
});

console.log('✅ ArenaX Support page loaded');
</script>
